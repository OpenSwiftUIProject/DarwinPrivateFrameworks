name: SFSymbolsExample

on:
  push:
    branches: [main]
    paths:
      - 'SFSymbols/**'
      - 'Example/SFSymbolsExample/**'
      - 'Example/Resources/**'
      - 'Example/Project.swift'
      - 'Example/Tuist.swift'
      - 'Example/Tuist/**'
      - 'Example/mise.toml'
      - 'Package.swift'
      - '.github/actions/build-example/**'
      - '.github/workflows/sfsymbols_example.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SFSymbols/**'
      - 'Example/SFSymbolsExample/**'
      - 'Example/Resources/**'
      - 'Example/Project.swift'
      - 'Example/Tuist.swift'
      - 'Example/Tuist/**'
      - 'Example/mise.toml'
      - 'Package.swift'
      - '.github/actions/build-example/**'
      - '.github/workflows/sfsymbols_example.yml'

jobs:
  build:
    name: Build SFSymbolsExample (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS"
            runs-on: '["macos-15", "xcode-26.6"]'
          - platform: iOS Simulator
            destination: "generic/platform=iOS Simulator"
            runs-on: '["macos-15", "xcode-26.6"]'
          - platform: macOS
            destination: "platform=macOS"
            runs-on: '["macos-15", "xcode-26.6"]'
          - platform: visionOS
            destination: "generic/platform=visionOS"
            runs-on: '["macos-15", "xcode-26.6", "visionos-simulator-2.5"]'
          - platform: visionOS Simulator
            destination: "generic/platform=visionOS Simulator"
            runs-on: '["macos-15", "xcode-26.6", "visionos-simulator-2.5"]'
    # visionOS builds need a visionOS Simulator runtime that matches the SDK.
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-example
        with:
          scheme: SFSymbolsExample
          destination: ${{ matrix.destination }}
          xcode-version: "26.6"
